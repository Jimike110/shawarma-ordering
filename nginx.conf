server {
    access_log off;
    error_log /dev/stderr crit;
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 # Private tracking tokens are in API paths. Keep them out of nginx logs.
 location /api/ { access_log off; error_log /dev/null; proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
 location /assets/ { expires 1y; }
 location / { expires -1; try_files $uri $uri/ /index.html; }
}
