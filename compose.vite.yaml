# Local hot-reload frontend. Uses the same project/database and localhost:5173.
# Port 80 inside the container reuses the base file's 127.0.0.1:5173:80 mapping.
services:
  web:
    image: shawarma-ordering-web-dev
    build: { context: ., dockerfile: Dockerfile.dev }
    working_dir: /app
    volumes:
      - .:/app
      - frontend_dev_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_USE_POLLING: 'true'
      VITE_HMR_CLIENT_PORT: '5173'
    healthcheck:
      start_period: 60s
volumes:
  frontend_dev_node_modules:
