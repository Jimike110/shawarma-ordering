services:
  frontend-tools:
    image: node:22-alpine
    profiles: [tools]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      API_PROXY_TARGET: http://api:8080
      LOCAL_API_URL: http://web
  backend-tools:
    image: golang:1.25.5-alpine
    profiles: [tools]
    working_dir: /app/backend
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://shawarma:${POSTGRES_PASSWORD}@db:5432/shawarma?sslmode=disable
volumes:
  go_modules:
  go_build:
